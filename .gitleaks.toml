# Gitleaks configuration for mushi-mushi.
# Extends the bundled default ruleset, adds Mushi-specific detection rules,
# and maintains a narrow path allowlist for known test fixtures.
#
# Registration: mushi_ and mush_pk_ prefixes are registered with the GitHub
# Secret Scanning partner program — any leaked key matching these patterns
# will trigger an automated revocation callback. See SECURITY.md.

[extend]
useDefault = true

# ─────────────────────────────────────────────────────────────────────────────
# Mushi-specific secret detection rules
# ─────────────────────────────────────────────────────────────────────────────

[[rules]]
id = "mushi-sdk-api-key"
description = "Mushi SDK API key (mushi_… prefix)"
# Format: mushi_<env>_<40+ base62 chars>
# Examples: mushi_live_abc123…  mushi_test_abc123…
regex = '''mushi_(?:live|test|dev|sk)_[A-Za-z0-9]{20,}'''
entropy = 3.5
keywords = ["mushi_"]
[rules.allowlist]
paths = [
  '''packages/cli/src/doctor\.test\.ts''',
  '''packages/cli/src/device-auth\.test\.ts''',
  '''packages/cli/src/detect\.test\.ts''',
  '''packages/cli/src/heartbeat-wait\.test\.ts''',
  '''packages/cli/src/index\.test\.ts''',
  '''packages/cli/src/mcp-config\.test\.ts''',
  '''packages/cli/src/sanitize-config\.test\.ts''',
  '''packages/cli/src/login\.test\.ts''',
  # Fake Mushi API key in the MCP stdio resilience unit tests (stub fetch only).
  '''packages/mcp/src/__tests__/resilience\.test\.ts''',
  # Literal 'mushi_test_key_1234567890' passed to a stubbed sendOnUnload.
  '''packages/core/src/unload-transport\.test\.ts''',
]

[[rules]]
id = "mushi-project-api-key"
description = "Mushi project API key (mush_pk_… prefix)"
# Format: mush_pk_<40+ base62 chars>
regex = '''mush_pk_[A-Za-z0-9]{20,}'''
entropy = 3.5
keywords = ["mush_pk_"]
[rules.allowlist]
paths = [
  '''packages/cli/src/doctor\.test\.ts''',
  '''packages/cli/src/device-auth\.test\.ts''',
  '''packages/cli/src/detect\.test\.ts''',
  '''packages/cli/src/heartbeat-wait\.test\.ts''',
  '''packages/cli/src/index\.test\.ts''',
  '''packages/cli/src/mcp-config\.test\.ts''',
  '''packages/cli/src/sanitize-config\.test\.ts''',
  '''packages/cli/src/login\.test\.ts''',
  # Fake Mushi API key in the MCP stdio resilience unit tests (stub fetch only).
  '''packages/mcp/src/__tests__/resilience\.test\.ts''',
]

# ─────────────────────────────────────────────────────────────────────────────
# Global path allowlist
# ─────────────────────────────────────────────────────────────────────────────

[allowlist]
description = "Path allowlist for a redacted legacy-AWS audit note and CLI unit-test fixtures that embed obviously-fake Mushi API keys. Real keys (mushi_live_/mush_pk_) are never allowlisted."
paths = [
  # Redacted AWS access key ID (a public identifier, not a secret) in an audit note.
  '''docs/audit-2026-06-24/pre-launch-hardening-complete\.md''',
  # Hard-coded fake API keys in CLI unit tests only.
  '''packages/cli/src/doctor\.test\.ts''',
  '''packages/cli/src/device-auth\.test\.ts''',
  '''packages/cli/src/detect\.test\.ts''',
  '''packages/cli/src/heartbeat-wait\.test\.ts''',
  '''packages/cli/src/index\.test\.ts''',
  '''packages/cli/src/mcp-config\.test\.ts''',
  # Fake Mushi API key in the MCP stdio resilience unit tests (stub fetch only).
  '''packages/mcp/src/__tests__/resilience\.test\.ts''',
  # Literal 'mushi_test_key_1234567890' passed to a stubbed sendOnUnload.
  '''packages/core/src/unload-transport\.test\.ts''',
  # Voice intake unit tests set MUSHI_INTERNAL_CALLER_SECRET to the literal
  # 'voice-test-secret-0123456789' so the internal-caller guard has something
  # to compare against. Never a real value; the real one is a Supabase secret.
  '''packages/server/src/__tests__/voice-intake\.test\.ts''',
  '''packages/server/src/__tests__/voice-intent\.test\.ts''',
  # Unit tests that hand a stubbed fetch / a fake Hono context an obviously
  # invented key so the auth path has something to read — 'mushi_abc123_secret',
  # 'mushi_publickey_in_every_browser', and similar. Flagged by the default
  # generic-api-key rule on the master scan of f5e94ce9 (run 35737999381);
  # every finding was a fixture. A real key (mushi_live_/mush_pk_) is never
  # allowlisted, and these paths are all *.test.ts.
  '''packages/cli/src/commands/setup\.test\.ts''',
  '''packages/mcp/src/__tests__/ergonomics\.test\.ts''',
  '''packages/mcp/src/__tests__/param-casing\.test\.ts''',
  '''packages/mcp/src/__tests__/report-shapes\.test\.ts''',
  '''packages/mcp/src/__tests__/stdio-attribution\.test\.ts''',
  '''packages/mcp/src/__tests__/triage-untrusted\.test\.ts''',
  '''packages/mcp/src/__tests__/use-mushi-router\.test\.ts''',
  '''packages/server/src/__tests__/mcp-key-browser-exposure\.test\.ts''',
  '''packages/server/src/__tests__/reporter-auth\.test\.ts''',
  '''packages/server/src/__tests__/report-ingest-reporter-key\.test\.ts''',
  '''packages/server/supabase/functions/api/routes/events-hardening\.test\.ts''',
]
