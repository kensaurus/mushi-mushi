# Mushi UX pass on a host's CI runner (Plan 021 Phase 4, ADR 0020)
#
# Runs in a HOST repo when Mushi's console fires `repository_dispatch`
# (event `mushi-ux-run`) or someone runs the workflow by hand. It starts the
# app's dev server, runs `mushi-ux run` screen by screen with a Cursor Cloud
# agent, syncs the run to the console (Check → UX runs), and opens ONE draft
# PR with the kept changes. It never merges.
#
# Use from the host workflow template: docs/templates/mushi-ux.yml
#   - uses: kensaurus/mushi-mushi/.github/actions/ux-loop@master
#
# Only `cursor-cloud` runs here. actions/checkout keeps a token with
# contents:write in .git/config; an agent running on this runner could read it
# (ADR 0006). The cloud agent edits on Cursor's side and never sees it.
#
# Requirements: actions/checkout (default credentials kept), actions/setup-node,
# `permissions: contents: write, pull-requests: write`, and these in env:
#   CURSOR_API_KEY (required), MUSHI_API_KEY + MUSHI_PROJECT_ID (to sync),
#   ANTHROPIC_API_KEY (optional: the final before/after review).
name: Mushi UX pass
description: Run a Mushi UX pass screen by screen with a Cursor Cloud agent and open one draft PR.
author: kensaurus
branding:
  icon: eye
  color: green

inputs:
  dev-command:
    description: Dev server command; {port} is replaced and PORT is set. e.g. "pnpm dev --port {port}"
    required: true
  agent:
    description: Coding agent. Only cursor-cloud runs on CI.
    required: false
    default: cursor-cloud
  model:
    description: Cursor model id, optionally with ?param=value (e.g. grok-4.7?reasoning_effort=xhigh). Empty = Cursor's default.
    required: false
    default: ''
  max-surfaces:
    description: Screens to work on (1-20).
    required: false
    default: '5'
  iterations:
    description: Attempts per screen (1-3).
    required: false
    default: '2'
  paths:
    description: Comma-separated start paths, e.g. "/,/pricing". Empty = discover from the root.
    required: false
    default: ''
  skill:
    description: Skill name from kensaurus/skills (or skills-repo) the agent applies, e.g. enhance-mobile-native-feel. Empty = built-in UX guidance.
    required: false
    default: ''
  skills-repo:
    description: owner/repo[@ref] skill names come from.
    required: false
    default: kensaurus/skills
  base:
    description: Ref to branch the run from. Empty = the checked-out commit.
    required: false
    default: ''
  ignore:
    description: CSS selectors that are not part of the app (one per line). Hidden in screenshots and skipped by every check. Dev overlays, build stamps and the Mushi widget are skipped already.
    required: false
    default: ''
  install-command:
    description: Install command for the worktree. Empty = from the lockfile.
    required: false
    default: ''
  ux-version:
    description: '@mushi-mushi/ux version range.'
    required: false
    default: '^0.1.0'
  draft-pr:
    description: "'false' to keep the branch without opening a draft PR."
    required: false
    default: 'true'

outputs:
  branch:
    description: The run branch (mushi-ux/<run id>), empty when nothing ran.
    value: ${{ steps.pr.outputs.branch }}
  pr-url:
    description: The draft PR, empty when none was opened.
    value: ${{ steps.pr.outputs.pr_url }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        AGENT: ${{ inputs.agent }}
        MODEL: ${{ inputs.model }}
        MAX_SURFACES: ${{ inputs.max-surfaces }}
        ITERATIONS: ${{ inputs.iterations }}
        START_PATHS: ${{ inputs.paths }}
        SKILL: ${{ inputs.skill }}
        SKILLS_REPO: ${{ inputs.skills-repo }}
      run: |
        set -euo pipefail
        if [ "$AGENT" != "cursor-cloud" ]; then
          echo "::error::Only cursor-cloud runs on CI: a local agent could read the checkout's token."
          exit 1
        fi
        if [ -z "${CURSOR_API_KEY:-}" ]; then
          echo "::error::Set the CURSOR_API_KEY secret (cursor.com/settings → Integrations → API keys)."
          exit 1
        fi
        if ! [[ "$MAX_SURFACES" =~ ^[0-9]{1,2}$ ]] || [ "$MAX_SURFACES" -lt 1 ] || [ "$MAX_SURFACES" -gt 20 ]; then
          echo "::error::max-surfaces must be 1-20."; exit 1
        fi
        [[ "$ITERATIONS" =~ ^[1-3]$ ]] || { echo "::error::iterations must be 1, 2 or 3."; exit 1; }
        model_re='^[A-Za-z0-9][A-Za-z0-9._:?=&-]{0,199}$'
        paths_re='^/[A-Za-z0-9/_.~,-]*$'
        if [ -n "$MODEL" ] && ! [[ "$MODEL" =~ $model_re ]]; then
          echo "::error::Unrecognised model id."; exit 1
        fi
        if [ -n "$START_PATHS" ] && { [ ${#START_PATHS} -gt 620 ] || ! [[ "$START_PATHS" =~ $paths_re ]]; }; then
          echo "::error::paths must be comma-separated and start with /."; exit 1
        fi
        if [ -n "$SKILL" ] && ! [[ "$SKILL" =~ ^[a-z0-9][a-z0-9-]{0,80}$ ]]; then
          echo "::error::skill must be a skill name, e.g. enhance-mobile-native-feel."; exit 1
        fi
        if ! [[ "$SKILLS_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(@[A-Za-z0-9_./-]+)?$ ]]; then
          echo "::error::skills-repo must look like owner/repo[@ref]."; exit 1
        fi
        if [ -z "${MUSHI_API_KEY:-}" ] || [ -z "${MUSHI_PROJECT_ID:-}" ]; then
          echo "::warning::MUSHI_API_KEY / MUSHI_PROJECT_ID not set: the run will not show up in the console."
        fi

    - shell: bash
      env:
        UX_VERSION: ${{ inputs.ux-version }}
      run: |
        set -euo pipefail
        corepack enable 2>/dev/null || true
        # The browser for the ux package's own Playwright, not whatever `npx playwright` resolves.
        npx --yes --package "@mushi-mushi/ux@${UX_VERSION}" playwright install --with-deps chromium

    - id: run
      shell: bash
      env:
        AGENT: ${{ inputs.agent }}
        MODEL: ${{ inputs.model }}
        MAX_SURFACES: ${{ inputs.max-surfaces }}
        ITERATIONS: ${{ inputs.iterations }}
        START_PATHS: ${{ inputs.paths }}
        SKILL: ${{ inputs.skill }}
        SKILLS_REPO: ${{ inputs.skills-repo }}
        BASE_REF: ${{ inputs.base }}
        IGNORE: ${{ inputs.ignore }}
        DEV_COMMAND: ${{ inputs.dev-command }}
        INSTALL_COMMAND: ${{ inputs.install-command }}
        UX_VERSION: ${{ inputs.ux-version }}
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      run: |
        set -euo pipefail
        args=(run --dev "$DEV_COMMAND" --agent "$AGENT" --max-surfaces "$MAX_SURFACES" --iterations "$ITERATIONS" --no-dashboard)
        [ -n "$MODEL" ] && args+=(--model "$MODEL")
        [ -n "$INSTALL_COMMAND" ] && args+=(--install "$INSTALL_COMMAND")
        [ -n "$SKILL" ] && args+=(--skill "$SKILL" --skills-repo "$SKILLS_REPO")
        [ -n "$BASE_REF" ] && args+=(--base "$BASE_REF")
        # mushi-ux rejects a selector it cannot inject safely, so no shell check here.
        while IFS= read -r sel; do
          if [ -n "${sel// }" ]; then args+=(--ignore "$sel"); fi
        done <<< "$IGNORE"
        if [ -n "$START_PATHS" ]; then
          IFS=',' read -ra starts <<< "$START_PATHS"
          for p in "${starts[@]}"; do [ -n "$p" ] && args+=(--path "$p"); done
        fi
        [ -z "${ANTHROPIC_API_KEY:-}" ] && args+=(--no-judge)
        if [ -n "${MUSHI_API_KEY:-}" ] && [ -n "${MUSHI_PROJECT_ID:-}" ]; then args+=(--sync); fi
        npx --yes --package "@mushi-mushi/ux@${UX_VERSION}" mushi-ux "${args[@]}"

    - id: pr
      if: always() && steps.check.outcome == 'success'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        DRAFT_PR: ${{ inputs.draft-pr }}
        REPO: ${{ github.repository }}
        SERVER: ${{ github.server_url }}
      run: |
        set -euo pipefail
        echo "branch=" >> "$GITHUB_OUTPUT"
        echo "pr_url=" >> "$GITHUB_OUTPUT"
        branch=$(git for-each-ref --sort=-committerdate --count=1 --format='%(refname:short)' 'refs/heads/mushi-ux/')
        if [ -z "$branch" ]; then
          echo "No run branch; nothing to open."
          exit 0
        fi
        echo "branch=$branch" >> "$GITHUB_OUTPUT"
        base="${GITHUB_REF_NAME}"
        kept=$(git rev-list --count "HEAD..$branch")
        if [ "$kept" = "0" ]; then
          echo "No screen kept a change; no PR."
          exit 0
        fi
        # The branch name is unique to this run; the cloud agent pushed earlier states of it.
        git push --force origin "$branch:refs/heads/$branch"
        compare="$SERVER/$REPO/compare/$base...$branch?expand=1"
        if [ "$DRAFT_PR" != "true" ]; then
          echo "Kept $kept change(s) on $branch: $compare"
          exit 0
        fi
        body=$(printf '%s\n\n%s\n\n%s\n' \
          "Mushi UX pass: $kept change(s) kept, one commit per screen. Each one was measured before and after (accessibility, overflow, tap targets, console errors, layout shift); see Check → UX runs in the Mushi console for the screenshots." \
          "Review it like any other change. Nothing here merges on its own." \
          "Opened with this workflow's GITHUB_TOKEN, so your CI does not run on it until you push or re-run it.")
        err=$(mktemp)
        if url=$(gh pr create --repo "$REPO" --draft --base "$base" --head "$branch" --title "UX pass: $kept screen(s) improved" --body "$body" 2>"$err"); then
          url=$(printf '%s\n' "$url" | tail -n 1)
          echo "pr_url=$url" >> "$GITHUB_OUTPUT"
          echo "Draft PR: $url"
        else
          # Common cause: "Allow GitHub Actions to create and approve pull requests" is off.
          echo "::warning::Could not open the draft PR ($(head -c 300 "$err" | tr '\n' ' ')). Open it from: $compare"
        fi
