# Self-host images and an end-to-end install test.
#
# smoke:   builds the three images, runs deploy/selfhost/install.sh on a fresh
#          machine (Supabase kit + every migration from an empty database),
#          then checks the API, the console and a signed-in API call.
#          Runs on PRs that touch the server, the console or deploy/selfhost.
# publish: on master, pushes multi-arch images to GHCR
#          (ghcr.io/kensaurus/mushi-{functions,migrate,admin}: latest, sha-<7>).
name: Self-host images

on:
  pull_request:
    paths:
      - 'packages/server/supabase/**'
      - 'apps/admin/**'
      - 'packages/core/**'
      - 'packages/brand/**'
      - 'deploy/selfhost/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/selfhost-images.yml'
  push:
    branches: [master]
    paths:
      - 'packages/server/supabase/**'
      - 'apps/admin/**'
      - 'packages/core/**'
      - 'packages/brand/**'
      - 'deploy/selfhost/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/selfhost-images.yml'
  workflow_dispatch:

concurrency:
  group: selfhost-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Build the images
        run: |
          for img in migrate functions admin; do
            docker build -q -f "deploy/selfhost/$img/Dockerfile" -t "ghcr.io/kensaurus/mushi-$img:ci" .
          done

      - name: Install from scratch
        env:
          MUSHI_VERSION: ci
          MUSHI_SKIP_PULL: '1'
        run: sh deploy/selfhost/install.sh --dir "$RUNNER_TEMP/mushi" --email ci@example.com --yes | tee "$RUNNER_TEMP/install.log"

      - name: Check the running install
        working-directory: ${{ runner.temp }}/mushi
        run: |
          set -eu
          sh mushi.sh status
          docker compose logs mushi-migrate | tail -3
          # API ready (database reachable, required env present)
          curl -fsS http://127.0.0.1:8000/functions/v1/api/health/ready
          # Console and its same-origin proxy
          curl -fsS http://127.0.0.1:3000/healthz
          curl -fsS http://127.0.0.1:3000/runtime-config.js | grep -q '"instanceType": "self-hosted"'
          curl -fsS http://127.0.0.1:3000/functions/v1/api/health
          # Sign in as the admin the installer created, then call the API as them.
          pass=$(sed -n 's/^  Password: \([^ ]*\).*/\1/p' "$RUNNER_TEMP/install.log")
          anon=$(sed -n 's/^ANON_KEY=//p' .env)
          token=$(curl -fsS -X POST 'http://127.0.0.1:3000/auth/v1/token?grant_type=password' \
            -H "apikey: $anon" -H 'Content-Type: application/json' \
            -d "{\"email\":\"ci@example.com\",\"password\":\"$pass\"}" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
          test -n "$token"
          curl -fsS http://127.0.0.1:3000/functions/v1/api/v1/admin/projects \
            -H "Authorization: Bearer $token" -H "apikey: $anon" >/dev/null
          # Open sign-up is closed
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/auth/v1/signup \
            -H "apikey: $anon" -H 'Content-Type: application/json' -d '{"email":"x@example.com","password":"long-enough-1"}')
          test "$code" != 200
          # Scheduled jobs call this install, not the hosted service
          docker compose exec -T db psql -U postgres -At -c \
            "select value from public.mushi_runtime_config where key = 'supabase_url'" | grep -qx 'http://api-gw:8000'
          # Nothing but the console listens beyond loopback
          ! docker compose ps --format '{{.Ports}}' | grep -q '0.0.0.0'

      - name: Logs on failure
        if: failure()
        working-directory: ${{ runner.temp }}/mushi
        run: docker compose logs --tail 80 mushi-migrate functions mushi-admin auth db || true

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: [migrate, functions, admin]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/kensaurus/mushi-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: deploy/selfhost/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/kensaurus/mushi-${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
