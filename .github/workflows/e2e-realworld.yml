# FILE: .github/workflows/e2e-realworld.yml
# PURPOSE: CI gate for the RealWorld/Conduit Playwright journey.
#
# The suite boots four local processes (ingest stub, Express, two Vite
# frontends) and is excluded from `pnpm test` so the required Build & Test
# job stays fast. It is hermetic: SDK traffic hits tests/ingest-stub.mjs.
# The MCP step stays skipped unless MUSHI_PROJECT_ID and MUSHI_API_KEY
# are set, which this job does not do.
#
# Run locally: MUSHI_REALWORLD=1 pnpm e2e:realworld

name: RealWorld e2e

on:
  pull_request:
    branches: [master]
    paths:
      - 'examples/realworld/**'
      - 'packages/core/**'
      - 'packages/web/**'
      - 'packages/react/**'
      - 'packages/node/**'
      - '.github/workflows/e2e-realworld.yml'
  schedule:
    # Once a day, offset from the 06:00 dogfood and 07:00 prod PDCA crons.
    - cron: '15 5 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-realworld-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  realworld:
    name: RealWorld conduit journey
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40  # v2.19.0
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v4.1.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK packages the fixtures import
        # Vite and the Express fixture resolve workspace packages from dist/.
        run: pnpm --filter "@mushi-mushi/react..." --filter "@mushi-mushi/node..." build

      - name: Install Playwright browsers
        run: pnpm --filter mushi-realworld exec playwright install --with-deps chromium

      - name: Run RealWorld journey
        env:
          MUSHI_REALWORLD: '1'
        run: pnpm e2e:realworld

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report-realworld
          path: |
            examples/realworld/playwright-report/
            examples/realworld/test-results/
          retention-days: 7
          if-no-files-found: ignore
