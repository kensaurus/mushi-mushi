name: CLA

# Asks outside contributors to sign the Contributor License Agreement (CLA.md)
# once, by commenting on their pull request. Why there is a CLA:
# docs/adr/0036-licensing-posture.md (dual licensing needs every contribution
# to come in with the same rights).
#
# Signatures are stored in the repository itself, in
# signatures/version1/cla.json on the `cla-signatures` branch (created by the
# first step below if it does not exist). That branch must stay unprotected so
# the action can commit to it. If CLA.md changes materially, bump the path to
# signatures/version2/ so everyone signs the new text.
#
# SECURITY: `pull_request_target` runs with base-branch permissions. Nothing
# here checks out or runs pull request code; the action only reads the PR's
# commit list and comments through the API. Pull requests from branches of
# this repository are skipped (anyone who can push here is a maintainer, and
# the maintainer's cloud agents commit as unlinked "Cursor Agent" identities),
# so the check only ever runs for forks. Bots and the owner are allowlisted.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions: {}

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: CLA signed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The action reruns earlier workflow runs on "recheck" (actions), commits
    # signatures (contents), comments and locks merged PRs (pull-requests) and
    # sets the commit status (statuses). Nothing else.
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    if: >-
      (github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name != github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40  # v2.19.0
        with:
          egress-policy: audit

      # A comment event does not say where the PR comes from, so look it up:
      # branches of this repository are skipped here too. Then make sure the
      # signatures branch exists (the action only writes to an existing one).
      - name: Scope the check and ensure the signatures branch
        id: scope
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request
              ?? (await github.rest.pulls.get({ owner, repo, pull_number: context.issue.number })).data;
            if (pr.head.repo?.full_name === `${owner}/${repo}`) {
              core.info('Pull request from a branch of this repository: no CLA needed.');
              core.setOutput('skip', 'true');
              return;
            }
            try {
              await github.rest.git.getRef({ owner, repo, ref: 'heads/cla-signatures' });
            } catch (e) {
              if (e.status !== 404) throw e;
              const base = await github.rest.git.getRef({ owner, repo, ref: 'heads/master' });
              await github.rest.git.createRef({ owner, repo, ref: 'refs/heads/cla-signatures', sha: base.data.object.sha });
              core.info('Created cla-signatures from master.');
            }
            core.setOutput('skip', 'false');

      - name: CLA Assistant
        if: steps.scope.outputs.skip != 'true'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08  # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/kensaurus/mushi-mushi/blob/master/CLA.md
          branch: cla-signatures
          allowlist: kensaurus,*[bot]
          lock-pullrequest-aftermerge: true
