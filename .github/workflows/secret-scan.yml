# FILE: secret-scan.yml
# PURPOSE: Server-side secret scanning with Gitleaks on every PR and
#          push to master. Belt-and-suspenders to the local pre-commit
#          hook (scripts/check-no-secrets.mjs) — that hook can be
#          bypassed with `git commit --no-verify`, but this CI gate
#          cannot. Catches:
#            - Contributors who skipped the hook
#            - Contributors who never installed the hook (e.g. opened a
#              PR via the GitHub web UI without cloning)
#            - Secrets already sitting in the tree, which no diff-scoped
#              scan can see (the "whole tracked tree" job below)
#
# WHY: Gitleaks ships ~150 patterns covering AWS / Stripe / GitHub /
# Anthropic / OpenAI / Slack / Supabase / generic JWT / RSA keys / etc.
# Our local scanner covers the same surface but on staged files only.
#
# TWO JOBS, DELIBERATELY. gitleaks-action is diff-scoped: on a PR it scans
# the PR's commits, on a push it scans that push's commits. It never scans
# the whole tree — an earlier version of this header claimed an "--all mode
# runs on push to master", which was simply untrue. A live project API key
# therefore sat in five tracked files for months without this workflow ever
# failing; it was found on 2026-09-23 only by scanning the tree directly.
# The second job closes that gap.
#
# REFERENCES
#   - https://github.com/gitleaks/gitleaks-action
#   - https://github.com/gitleaks/gitleaks

name: Secret scan

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40  # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          # Full history so push-to-master scans can flag historical
          # commits, not just the diff. PRs use shallow checkout via the
          # action's own git fetch.
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only needed for organisations with >25
          # contributors. Personal repos run free indefinitely; the
          # action skips the license check when this var is absent.

  whole-tree:
    name: Gitleaks (whole tracked tree)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40  # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install pinned Gitleaks
        run: |
          set -euo pipefail
          VERSION=8.28.0
          # From the release's own gitleaks_${VERSION}_checksums.txt.
          SHA256=a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan every tracked file
        run: |
          set -euo pipefail
          # Materialise exactly the tracked files — not the checkout, which
          # also holds .git and any build output. This is the same corpus the
          # scan was validated against locally.
          rm -rf /tmp/tracked && mkdir -p /tmp/tracked
          git ls-files -z | tar -cf - --null -T - | tar -x -C /tmp/tracked
          ./gitleaks dir /tmp/tracked --config .gitleaks.toml --redact --no-banner
