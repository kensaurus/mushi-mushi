##
# FILE: deploy-hosted-mcp.yml
# PURPOSE: Wire kensaur.us/mushi-mushi/hosted-mcp → Supabase MCP, plus the
#          origin OAuth discovery documents (RFC 9728 PRM, RFC 8414 AS).
# Trigger manually after merging script changes — no admin/docs build required.
##

name: Deploy Hosted MCP Proxy

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/cloudfront-mushi-hosted-mcp-*'
      - 'scripts/aws-setup-hosted-mcp.mjs'
      - 'scripts/hosted-mcp-oauth-metadata.json'
      - 'scripts/verify-hosted-mcp.mjs'
      - 'scripts/verify-hosted-mcp-helpers.mjs'
      - 'scripts/verify-hosted-mcp-helpers.test.mjs'

permissions:
  contents: read
  id-token: write

# A deploy: serialize, never cancel one in flight.
concurrency:
  group: deploy-hosted-mcp
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Setup hosted MCP on CloudFront
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: node scripts/aws-setup-hosted-mcp.mjs

      - name: Invalidate CloudFront cache
        # One path, not a list (2026-11-01): CloudFront bills $0.005 per invalidation
        # PATH after the first 1,000 a month, and a wildcard counts as one path.
        # This deploy's 12-path list made the shared kensaur.us distribution
        # ~$10/month over the free 1,000 (AWS Cost Explorer, October 2026: 3,166
        # paths). "/*" covers /mushi-mushi/*, the apex docs prefixes and the
        # /.well-known OAuth paths in one path; the other apps on this
        # distribution serve hashed assets, so a refetch costs only S3 GETs.
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --region us-east-1

      - name: Wait and smoke test
        run: |
          sleep 90
          node scripts/verify-hosted-mcp.mjs
