# FILE: publish-mcp-registry.yml
# PURPOSE: Manually (re)publish @mushi-mushi/mcp to the official MCP registry
#          when the Release workflow's post-publish step is skipped (e.g. CDN
#          audit-signature race after a successful npm publish).
#
# USAGE:   gh workflow run "Publish MCP Registry" --ref master

name: Publish MCP Registry

on:
  workflow_dispatch:

concurrency:
  group: publish-mcp-registry-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to MCP registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 24

      - name: Sync server.json to package.json version
        run: node scripts/sync-server-json-version.mjs

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${os}_${arch}.tar.gz" | tar xz mcp-publisher

      - name: Login + publish
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          cd packages/mcp
          ../../mcp-publisher publish
          cd ../..

      - name: Verify registry record
        run: |
          set -euo pipefail
          expected=$(node -p "require('./packages/mcp/package.json').version")
          echo "Expecting registry version ${expected}"
          sleep 5
          body=$(curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.kensaurus/mushi-mushi")
          echo "$body" | grep -q "io.github.kensaurus/mushi-mushi"
          if echo "$body" | grep -q "\"version\": \"${expected}\""; then
            echo "✓ Mushi MCP server ${expected} is live in the official registry"
          else
            echo "::warning::Registry may still be propagating ${expected}; record exists but exact version string not yet visible."
            echo "$body" | head -c 2000
          fi
