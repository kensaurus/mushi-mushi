# FILE: npm-bootstrap.yml
# PURPOSE: Publish the FIRST version of a package npm has never seen, the one
#          publish GitHub OIDC trusted publishing cannot do (a Trusted
#          Publisher rule can only be added to a package that exists).
#
# WHY A SEPARATE WORKFLOW: this is the only place a long-lived npm token is
# used. It used to run inside release.yml, the job holding `id-token: write`
# that npm's Trusted Publisher rules trust, which put a 2FA-bypass token next
# to the OIDC identity and every third-party step of the release. Here it is
# manual, has no `id-token`, and runs behind the `npm-bootstrap` environment.
#
# ONE-TIME SETUP (repo admin):
#   1. Settings → Environments → New environment `npm-bootstrap`, add a
#      required reviewer, restrict it to the `master` branch.
#   2. Move the NPM_TOKEN secret into that environment (delete the repo-level
#      one) so no other workflow can read it. A granular token scoped to
#      the @mushi-mushi scope, short expiry, created only when needed.
#
# USAGE:
#   gh workflow run "npm Bootstrap" --ref master
#   Then, for each package it published: npmjs.com → package → Settings →
#   Trusted Publisher → GitHub Actions, kensaurus/mushi-mushi, release.yml.
#   Later versions go through release.yml with provenance.

name: npm Bootstrap

on:
  workflow_dispatch:

concurrency:
  group: npm-bootstrap
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bootstrap:
    name: Publish brand-new packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-bootstrap
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40  # v2.19.0
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v4.1.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: List packages npm has never seen
        id: check
        # Exits 1 when there is something to bootstrap; nothing to do is a pass.
        run: |
          if node scripts/bootstrap-new-packages.mjs --check; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.pending == 'true'
        run: pnpm turbo run build --output-logs=errors-only

      - name: Publish first versions (no provenance)
        if: steps.check.outputs.pending == 'true'
        run: node scripts/bootstrap-new-packages.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "false"
