name: 'Mushi Mushi CI Gate'
description: 'Run Mushi Mushi MCP tools from GitHub Actions — trigger judge, dispatch fixes, gate PR merges on classification coverage.'
author: 'Kenji Sakuramoto'
branding:
  icon: bug
  color: green

inputs:
  api-key:
    description: 'Mushi project API key (store as a repo secret).'
    required: true
  project-id:
    description: 'Mushi project UUID.'
    required: true
  api-endpoint:
    description: 'Override API endpoint for self-hosted instances.'
    required: false
    default: 'https://dxptnwrhwsqckaftyymj.supabase.co/functions/v1/api'
  command:
    description: 'Which command to run: trigger-judge | dispatch-fix | check-coverage | query | gates | discover-api | spec-drift | discovery-status | propose | auth-bootstrap'
    required: true
  report-id:
    description: 'Report UUID — required for dispatch-fix.'
    required: false
  inventory-action-node-id:
    description: 'For command=dispatch-fix: optional spec-traceability anchor (whitepaper §2.10). When provided, the worker skips the graph walk to recover the inventory Action and includes its expected_outcome contract verbatim in the LLM prompt.'
    required: false
  question:
    description: 'NL query text — required for command=query.'
    required: false
  min-coverage:
    description: 'For check-coverage: minimum classified/total ratio to pass.'
    required: false
    default: '0.8'
  fail-on-quota:
    description: 'Whether to fail the action when Mushi returns 402 QUOTA_EXCEEDED.'
    required: false
    default: 'true'
  commit-sha:
    description: 'For command=gates and spec-drift: commit SHA the gates run against. Defaults to GITHUB_SHA.'
    required: false
  pr-number:
    description: 'For command=gates and spec-drift: pull-request number, used to scope findings on the admin UI.'
    required: false
  gates:
    description: 'For command=gates: comma-separated subset to run. "all" = dead_handler, mock_leak, api_contract, status_claim, orphan_endpoint, unknown_call (crawl runs from Inventory → Reconcile, not here).'
    required: false
    default: 'all'
  eslint-report:
    description: 'For command=gates: path to an ESLint JSON report (eslint -f json) made with eslint-plugin-mushi-mushi. Required when dead_handler or mock_leak is run; without it the step fails.'
    required: false
  repo-root:
    description: 'For command=discover-api: directory to walk for Next.js route handlers + OpenAPI files. For command=gates: root that eslint-report file paths are made relative to. Defaults to GitHub workspace.'
    required: false
  openapi-file:
    description: 'For command=discover-api: explicit OpenAPI file path. Defaults to <repo-root>/openapi.yaml.'
    required: false
  supabase-url:
    description: 'For command=discover-api: Supabase project URL to introspect via /rest/v1/.'
    required: false
  supabase-anon-key:
    description: 'For command=discover-api: Supabase anon key for introspection.'
    required: false
  base-spec:
    description: 'For command=spec-drift: path or URL of the base OpenAPI spec (the previous version). Required for spec-drift.'
    required: false
  head-spec:
    description: 'For command=spec-drift: path or URL of the head OpenAPI spec (this PR). Required for spec-drift.'
    required: false
  fail-on-breaking:
    description: 'For command=spec-drift: fail the step when oasdiff finds a breaking change.'
    required: false
    default: 'true'

outputs:
  result:
    description: 'JSON payload returned by the Mushi API.'
  coverage:
    description: 'For check-coverage: observed classified ratio.'
  findings:
    description: 'For spec-drift: JSON array of the oasdiff findings.'
  ready_to_propose:
    description: 'For discovery-status: "true" when there is enough SDK discovery data to propose an inventory.'
  total_events:
    description: 'For discovery-status: number of SDK discovery events recorded.'
  route_count:
    description: 'For discovery-status: number of routes discovered.'
  proposal_id:
    description: 'For propose: id of the inventory proposal to review on /inventory → Discovery.'

runs:
  using: 'node20'
  main: 'dist/cli.js'
