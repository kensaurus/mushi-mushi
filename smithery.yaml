# Mushi Mushi — stdio MCP server (@mushi-mushi/mcp).
#
# Display description (Smithery dashboard → Settings, and
# docs/marketing/smithery-external-publish.json#displayDescription):
#   MCP server for Cursor, Claude Code and Copilot. The bug mediator for
#   AI-built apps: plain-English diagnosis + a ready fix, in your editor.
# It is @mushi-mushi/mcp's npm description, composed from MUSHI_TAGLINE_V2 in
# packages/brand/src/index.js by scripts/normalize-package-metadata.mjs.
# smithery.yaml has no description key (runtime, build, startCommand, env
# only), so the listing text is set on the dashboard, not read from here.
startCommand:
  type: stdio
  configSchema:
    type: object
    description: >-
      MCP server for Cursor, Claude Code and Copilot. The bug mediator for
      AI-built apps: plain-English diagnosis + a ready fix, in your editor.
    required:
      - mushiApiKey
    properties:
      mushiApiKey:
        type: string
        description: >-
          Project ingest/admin API key minted in the Mushi console
          (Settings → API Keys). Scope mcp:read for triage, mcp:write to
          dispatch fixes.
      mushiProjectId:
        type: string
        description: Project UUID the key belongs to. Optional for single-project account keys.
      mushiApiEndpoint:
        type: string
        description: Override the API base URL (self-hosted deployments). Defaults to the hosted Mushi Cloud endpoint.
      mushiFeatures:
        type: string
        description: >-
          Comma-separated feature groups to expose
          (triage,fixes,inventory,setup,docs). Defaults to the lean
          catalog; use 'all' for the full tool set.
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', '@mushi-mushi/mcp@latest'],
      env: {
        MUSHI_API_KEY: config.mushiApiKey,
        ...(config.mushiProjectId ? { MUSHI_PROJECT_ID: config.mushiProjectId } : {}),
        ...(config.mushiApiEndpoint ? { MUSHI_API_ENDPOINT: config.mushiApiEndpoint } : {}),
        ...(config.mushiFeatures ? { MUSHI_FEATURES: config.mushiFeatures } : {}),
      },
    })
