# FILE: deploy/admin/nginx.conf
# PURPOSE: Serve the admin console SPA on :3000 (what docker-compose maps and
#          Caddy proxies to). Unknown paths fall back to index.html for the
#          client router; env.js is never cached so a restart with new
#          settings takes effect on the next load.

server {
    listen 3000;
    listen [::]:3000;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    location = /env.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
