# FILE: deployment-api.yaml
# PURPOSE: Kubernetes Deployment for Mushi Mushi API service

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: mushimushi
    component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: mushimushi
      component: api
  template:
    metadata:
      labels:
        app: mushimushi
        component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image }}:{{ .Values.global.image.tag }}"
          ports:
            - containerPort: 8000
          env:
            - name: SUPABASE_URL
              value: {{ required "global.supabaseUrl is required (the Supabase API gateway URL)" .Values.global.supabaseUrl | quote }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: anthropic-api-key
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: openai-api-key
            - name: MUSHI_INTERNAL_CALLER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: internal-caller-secret
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: jwt-secret
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: supabase-service-role-key
            {{- if .Values.global.region }}
            - name: MUSHI_CLUSTER_REGION
              value: {{ .Values.global.region | quote }}
            {{- end }}
            {{- if .Values.global.peerRegions }}
            - name: MUSHI_PEER_REGIONS
              value: {{ .Values.global.peerRegions | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
