# FILE: deploy/nginx-admin.conf
# PURPOSE: Serve the admin console SPA on :3000 (the port compose, Caddy and the
#          Helm chart expect). Unknown paths fall back to index.html so client
#          routes like /reports/123 load on refresh.
server {
    listen 3000;
    listen [::]:3000;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed build assets never change: cache them for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The service worker and the shell must revalidate, or a deploy never lands.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
