# Mushi Mushi on Supabase's self-host kit (tag self-hosted/v0.8.4). ADR 0064.
#
# install.sh copies this file next to the kit's docker-compose.yml and adds it
# to COMPOSE_FILE in .env, so plain `docker compose ...` (and the kit's run.sh)
# use both. What it adds or changes:
#   - functions: Mushi's edge functions (mushi-mushi-edge); JWT checks stay in
#     each handler, as in production (config.toml verify_jwt = false)
#   - mushi-migrate: applies Mushi's migrations on every start, then exits
#   - mushi-admin: the console, configured at start from MUSHI_PUBLIC_URL
#   - mushi-caddy: the one origin people use (console at /, API at /*/v1/)
#   - every published port binds to 127.0.0.1 unless MUSHI_BIND says otherwise
# Needs Docker Compose 2.24.4+ (for !override).

services:
  mushi-migrate:
    image: ghcr.io/kensaurus/mushi-mushi-migrate:${MUSHI_VERSION:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      PGHOST: ${POSTGRES_HOST}
      PGPORT: ${POSTGRES_PORT}
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      MUSHI_GATEWAY_URL: http://api-gw:8000
      MUSHI_INTERNAL_CALLER_SECRET: ${MUSHI_INTERNAL_CALLER_SECRET:?run install.sh or set MUSHI_INTERNAL_CALLER_SECRET in .env}

  functions:
    image: ghcr.io/kensaurus/mushi-mushi-edge:${MUSHI_VERSION:-latest}
    # The code is in the image; keep only the dependency cache. The kit's
    # command (no --port) keeps the runtime on 9000, where its gateway looks.
    volumes: !override
      - deno-cache:/root/.cache/deno
    depends_on:
      mushi-migrate:
        condition: service_completed_successfully
    # Your own model server on this machine (`sh mushi.sh llm`): Docker Desktop
    # knows this name; on Linux it has to be mapped to the host.
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      VERIFY_JWT: "false"
      MUSHI_INTERNAL_CALLER_SECRET: ${MUSHI_INTERNAL_CALLER_SECRET}
      # Links in emails, CLI sign-in, MCP and CORS all use the public URL.
      # GET /health says "self-hosted" (_shared/instance-mode.ts).
      MUSHI_INSTANCE_MODE: self-hosted
      MUSHI_ADMIN_URL: ${MUSHI_PUBLIC_URL}
      ADMIN_BASE_URL: ${MUSHI_PUBLIC_URL}
      SITE_URL: ${MUSHI_PUBLIC_URL}
      MUSHI_CONSOLE_URL: ${MUSHI_PUBLIC_URL}
      MUSHI_ADMIN_ORIGIN_ALLOWLIST: ${MUSHI_PUBLIC_URL}
      MUSHI_API_PUBLIC_URL: ${MUSHI_PUBLIC_URL}/functions/v1/api
      MCP_PUBLIC_BASE_URL: ${MUSHI_PUBLIC_URL}/functions/v1/mcp
      MUSHI_CLUSTER_REGION: ${MUSHI_CLUSTER_REGION:-us}
      # AI. All optional: without a key, reports are still taken and sorted by
      # rules; the plain-English diagnosis needs one of these.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      MUSHI_ALLOW_PRIVATE_LLM_BASE_URL: ${MUSHI_ALLOW_PRIVATE_LLM_BASE_URL:-false}
      MUSHI_OPENAI_MODEL: ${MUSHI_OPENAI_MODEL:-}
      MUSHI_OPENAI_EMBEDDING_MODEL: ${MUSHI_OPENAI_EMBEDDING_MODEL:-}
      MUSHI_OPENAI_MODEL_MAP: ${MUSHI_OPENAI_MODEL_MAP:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Optional integrations
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SENTRY_DSN_SERVER: ${SENTRY_DSN_SERVER:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}

  mushi-admin:
    image: ghcr.io/kensaurus/mushi-mushi-admin:${MUSHI_VERSION:-latest}
    container_name: mushi-admin
    restart: unless-stopped
    environment:
      MUSHI_PUBLIC_URL: ${MUSHI_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true

  mushi-caddy:
    image: caddy:2.10-alpine
    container_name: mushi-caddy
    restart: unless-stopped
    depends_on:
      mushi-admin:
        condition: service_healthy
      api-gw:
        condition: service_healthy
    environment:
      # ":3000" serves plain http on the console port; `sh mushi.sh https <domain>`
      # sets your domain here and publishes 80/443 (caddy/docker-compose.https.yml).
      MUSHI_SITE_ADDRESS: ${MUSHI_SITE_ADDRESS:-:3000}
    ports:
      - ${MUSHI_BIND:-127.0.0.1}:${MUSHI_PORT:-3000}:3000
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - mushi_caddy_data:/data
      - mushi_caddy_config:/config
    security_opt:
      - no-new-privileges:true

  # Studio, the database and the pooler stay off the network: reach Studio
  # with an SSH tunnel to 127.0.0.1:8000 (user DASHBOARD_USERNAME).
  api-gw:
    ports: !override
      - 127.0.0.1:${API_GW_HTTP_PORT:-8000}:8000/tcp
  supavisor:
    ports: !override
      - 127.0.0.1:${POSTGRES_PORT}:5432
      - 127.0.0.1:${POOLER_PROXY_PORT_TRANSACTION}:6543
    # Supavisor's start script runs `ulimit -n 100000` and exits when the
    # container's hard limit is lower, which is Docker's default on many Linux
    # hosts (a GitHub runner, 2026-11-20). Docker sets this limit as root.
    ulimits:
      nofile:
        soft: 100000
        hard: 100000

volumes:
  mushi_caddy_data:
  mushi_caddy_config:
