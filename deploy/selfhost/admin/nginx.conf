# Mushi Mushi self-host: the console and its API on one origin.
# The console (a static SPA) is served from here; the Supabase API paths are
# proxied to the internal gateway, so the browser, the SDK, the CLI and MCP
# all use one URL (MUSHI_PUBLIC_URL) and no CORS setup is needed.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Behind Caddy/Traefik keep their scheme; direct access uses ours.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  client_max_body_size 25m;   # screenshots and voice notes on reports
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  # Supabase APIs -> the internal gateway (Envoy). Realtime needs WebSockets.
  location ~ ^/(rest|auth|storage|realtime|functions|graphql)/v1/ {
    proxy_pass http://api-gw:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 410s;
    proxy_buffering off;
  }

  # Written at container start from the environment (40-mushi-runtime-config.sh).
  location = /runtime-config.js {
    alias /tmp/mushi/runtime-config.js;
    default_type application/javascript;
    add_header Cache-Control "no-store" always;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # SPA: every other path is the app.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
