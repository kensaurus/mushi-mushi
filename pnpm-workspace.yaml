packages:
  - 'packages/*'
  - 'apps/*'
  - 'tooling/*'
  - 'examples/*'
  - 'examples/realworld/*'

# pnpm 10.33+ no longer reads these root policies from `package.json#pnpm`.
# Keep dependency resolution, audit policy, patches, and build-script trust in
# this canonical workspace config so local installs and frozen CI installs use
# the same controls.
allowBuilds:
  '@sentry/cli': true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
  sqlite3: true
  supabase: true

overrides:
  'undici@<6.24.0': '>=6.24.0'
  'undici@>=7.0.0 <7.29.0': '>=7.29.0 <8'
  'undici@>=8.0.0 <8.9.0': '>=8.9.0 <9'
  'jsdom>undici': '7.29.0'
  '@actions/http-client>undici': '8.9.0'
  '@connectrpc/connect-node>undici': '8.9.0'
  'axios@<1.16.0': '>=1.16.0'
  'form-data@<4.0.6': '>=4.0.6'
  'esbuild@>=0.27.3 <0.28.1': '>=0.28.1'
  '@xmldom/xmldom@<0.9.10': '>=0.9.10'
  'uuid@<14.0.0': '>=14.0.0'
  'postcss@<8.5.18': '>=8.5.18'
  'react-router@<7.18.0': '>=7.18.0 <8'
  'react-router-dom@<7.18.0': '>=7.18.0 <8'
  'next@<15.5.18': '>=15.5.18'
  'next@>=16.0.0 <16.2.11': '>=16.2.11'
  'find-my-way@<=9.6.0': '>=9.7.0'
  'devalue@<5.8.1': '>=5.8.1'
  'hono@<4.12.25': '>=4.12.25'
  'ip-address@<=10.3.0': '>=10.3.1'
  'fast-uri@<3.1.2': '>=3.1.2'
  'ajv>fast-uri': '4.1.2'
  'mermaid@<11.15.0': '>=11.15.0'
  'dompurify@<=3.4.10': '>=3.4.11'
  # Upper bounds are load-bearing on the next three: left unbounded, pnpm
  # resolves them to the newest major (js-yaml 5.x, nanoid 6.x), which breaks
  # the CJS consumers that pull them in (@changesets/parse, read-yaml-file,
  # postcss, @react-navigation/native). nanoid is pinned exactly rather than
  # ranged — see the minimumReleaseAgeExclude entry below.
  'js-yaml@>=3.0.0 <3.15.1': '>=3.15.1 <4'
  'js-yaml@>=4.0.0 <4.3.1': '>=4.3.1 <5'
  'nanoid@<3.3.17': '3.3.17'
  'brace-expansion@<1.1.16': '1.1.16'
  'brace-expansion@>=3.0.0 <5.0.9': '5.0.9'
  'fast-uri@>=4.0.0 <4.1.2': '4.1.2'
  '@fastify/ajv-compiler>fast-uri': '4.1.2'
  'fast-json-stringify>fast-uri': '4.1.2'
  'sharp@<0.35.0': '>=0.35.0'
  'protobufjs@<=7.5.7': '>=7.5.8'
  'onnxruntime-web>protobufjs': '>=8.4.1'
  'qs@>=6.11.1 <=6.15.1': '>=6.15.2'
  'tar@<7': '>=7.4.3'
  'ws@>=8.0.0 <8.21.0': '>=8.21.0'
  'ws@>=7.0.0 <7.5.11': '>=7.5.11'
  'ws@>=6.0.0 <6.2.4': '>=6.2.4'
  'shell-quote@<=1.8.4': '1.10.0'
  'react-router@>=7.0.0 <7.15.0': '>=7.15.0'
  'brace-expansion': '5.0.9'

patchedDependencies:
  'nextra-theme-docs@4.6.1': 'patches/nextra-theme-docs@4.6.1.patch'

auditConfig:
  ignoreGhsas:
    - 'GHSA-qwww-vcr4-c8h2'
    # image-size: two infinite-loop DoS advisories in the ICNS
    # (GHSA-w3rx-r6r6-pgpr) and JXL/HEIF (GHSA-5p2g-fcmc-qvqq) parsers.
    # Both are marked "Patched versions: <0.0.0" — no fixed release exists;
    # 2.0.2 is the newest published version and is still vulnerable, so
    # there is nothing to override to. Reachability: the only path is
    # apps__docs > @react-three/fiber > expo > @expo/metro > metro >
    # image-size, i.e. the docs site's Metro bundler measuring images
    # committed to this repo at build time. No untrusted image ever
    # reaches the parser, and nothing in the server/runtime tree depends
    # on it. Remove both when image-size ships a fix, or when apps/docs
    # drops @react-three/fiber (the only reason expo is in the tree).
    - 'GHSA-w3rx-r6r6-pgpr'
    - 'GHSA-5p2g-fcmc-qvqq'

# ---------------------------------------------------------------------------
# Supply-chain hardening (pnpm)
#
# This is the setting that actually runs in CI: every Release/CI workflow
# invokes `pnpm install --frozen-lockfile`, and pnpm reads its config from
# pnpm-workspace.yaml (npm's `.npmrc` is a fallback for non-pnpm flags only).
#
# minimumReleaseAge: 10080
#   = 7 days × 24 h × 60 min. Refuses to resolve a package version that was
#     published less than 7 days ago, slamming shut the window in which
#     real-world npm supply-chain attacks were detected and removed
#     (Axios 1.14.1 / 0.30.4: ~5 hours; Shai-Hulud worm Sept 2025: <12 h).
#     A 7-day cooldown would have blocked every public 2025–2026 incident.
#     SOURCE: https://pnpm.io/settings#minimumreleaseage
#
# minimumReleaseAgeExclude:
#   Our own scope is exempt so internal dogfooding (e.g. `pnpm add
#   @mushi-mushi/react@latest` minutes after a publish) keeps working.
# ---------------------------------------------------------------------------
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@mushi-mushi/*'
  - 'mushi-mushi'
  # Clear high advisories blocking required CI (postcss 8.5.18 path traversal,
  # brace-expansion 5.0.9 DoS, react-router 7.18 DoS).
  # GHSA-qwww-vcr4-c8h2 (react-router RSC CSRF, patched only in
  # react-router>=8.3.0) is ignored via this file's auditConfig —
  # react-router-dom has no 8.x release yet, and admin uses BrowserRouter
  # (not RSC). Remove the ignore when react-router-dom@8.3+ ships.
  - 'postcss'
  - 'brace-expansion'
  - 'react-router'
  - 'react-router-dom'
  # Security-patched transitive dep. fast-uri 3.1.2 / 4.1.2 fixes
  # GHSA-q3j6-qgpj-74h6 (path traversal) + host-confusion advisories pulled
  # in via @modelcontextprotocol/sdk → ajv. Patch shipped 2026-05-05; we
  # exempt it from the 7-day cooldown because the HIGH-severity vuln is
  # in every <=3.1.0 release and we run npm audit signatures + provenance
  # in CI as compensating controls.
  - 'fast-uri'
  # devalue 5.8.1 fixes GHSA-77vg-94rm-hx3p (DoS via sparse array). Patch
  # shipped 2026-05-15; exempt from 7-day cooldown — CI dependency-review
  # and npm audit --audit-level=high both gate on this advisory.
  - 'devalue'
  # protobufjs 7.5.6 fixes GHSA-66ff-xgx4-vchm / GHSA-jvwf-75h9-cwgg /
  # GHSA-75px-5xx7-5xc7 / GHSA-685m-2w69-288q (4 HIGH CVEs). Exempt from
  # 7-day cooldown — same compensating controls as devalue above.
  - 'protobufjs'
  # form-data 4.0.6 fixes GHSA-fjxv-7rqg-78g4 (HIGH: CRLF injection via
  # unescaped field names). Pulled in transitively via node-fetch in the dev
  # SDKs. Published 2026-06-13; exempt from the 7-day cooldown because the
  # vuln is in every <4.0.6 release and CI runs npm audit + provenance as
  # compensating controls. Enforced tree-wide via pnpm.overrides.
  - 'form-data'
  # undici 7.29.0 / 8.9.0 include the current fixes for TLS validation bypass,
  # WebSocket DoS, and private-cache cross-user disclosure. Dev/test-only in
  # this tree (pulled via jsdom for the admin vitest DOM env). Patches shipped
  # 2026-06-15; exempt from the 7-day cooldown so the pnpm.overrides above can
  # resolve the patched versions, keeping the `npm audit --audit-level=high`
  # CI gate green. undici is maintained by the Node.js core team (low
  # supply-chain risk) and provenance/audit-signatures run as compensating controls.
  - 'undici'
  # ip-address 10.3.1 fixes leading-zero octet ambiguity that can bypass SSRF
  # trust boundaries when parsers and resolvers disagree. It is transitive via
  # express-rate-limit; exempt only so the security override can resolve now.
  - 'ip-address'
  # next 16.2.11 fixes three HIGH advisories (middleware/proxy auth bypass in
  # App Router w/ Turbopack single locale, Server Actions DoS, Server Actions
  # SSRF on custom servers) affecting every >=16.0.0 <16.2.11 release.
  # Exempt from the 7-day cooldown so the pnpm.overrides pin can resolve the
  # patch and keep the `npm audit --audit-level=high` CI gate green. Vercel-
  # maintained; provenance + audit signatures run as compensating controls.
  - 'next'
  # next's version-locked platform binaries/compiler packages must move in
  # lockstep with the next override above.
  - '@next/*'
  # nanoid 3.3.17 fixes GHSA-2v37-7h3g-55p8 and carries GHSA-28wg-ghj8-5hjv's
  # fix (predictable IDs from the non-secure generator). Both HIGH; every
  # <3.3.17 release is affected, and the tree pulls 3.3.12 via
  # @react-navigation/native and 3.3.16 via postcss. Published 2026-08-04 —
  # 4 days old at the time of the pin, so the 7-day cooldown blocks it. The
  # override above pins the *exact* version 3.3.17 rather than a range, so
  # this exemption cannot silently pull a newer, less-vetted release (3.3.18
  # shipped 2026-08-08 and is deliberately not used). Provenance + audit
  # signatures run as compensating controls. Drop this entry once 3.3.17 is
  # past the cooldown and the pin can relax to a range.
  - 'nanoid'
  # find-my-way 9.7.0 fixes the HTTP/2 DDoS advisory (<=9.6.0). Dev/test-only
  # in this tree (pulled via fastify in the Node SDK's framework-adapter
  # tests). Same compensating controls as above.
  - 'find-my-way'

# strictDepBuilds: fail-fast on any dep that tries to run a postinstall
# hook the workspace hasn't pre-approved via this file's allowBuilds. Without
# this, pnpm only warns and keeps
# installing — turning it on means a malicious postinstall slipping into a
# transitive dep stops the install instead of running silently.
# SOURCE: https://pnpm.io/settings#strictdepbuilds  (default flips to true
# in pnpm v11; opt-in in 10.x)
strictDepBuilds: true

# blockExoticSubdeps: refuses to install transitive dependencies that resolve
# to a git URL, tarball URL, or filesystem path (i.e. anything that didn't
# go through the npm registry's signing pipeline). Direct workspace deps
# can still use these — but a malicious or compromised dep can't pull a
# silent git checkout into the tree.
# SOURCE: https://pnpm.io/settings#blockexoticsubdeps  (added pnpm 10.26)
blockExoticSubdeps: true
